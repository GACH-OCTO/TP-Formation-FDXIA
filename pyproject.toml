[project]
name = "fdxia-genai-tp"
version = "0.1.0"
description = "Pedagogical TP – Travel planner with Vertex AI (LLM, RAG, Agent)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.9.2",
    "google-genai>=1.0.0",
    "pydantic-ai-slim[google]>=0.0.43",
    "python-dotenv>=1.0.1",
    "pypdf>=5.1.0",
    "pydantic>=2.10.6",
    "requests>=2.32.3",
    "chromadb>=1.5.0",
    "tqdm>=4.67.3",
    "pydantic-ai>=1.67.0",
    "googlemaps>=4.10.0",
    "tavily-python>=0.7.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
